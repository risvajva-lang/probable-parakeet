apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.facebook.react'

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false

def jscFlavor = 'org.webkit:android-jsc:+' 

def releaseKeystorePath = System.getenv('KEYSTORE_PATH')
def releaseStorePassword = System.getenv('STORE_PASSWORD')
def releaseKeyAlias = System.getenv('KEY_ALIAS')
def releaseKeyPassword = System.getenv('KEY_PASSWORD')
def hasReleaseSigning = releaseKeystorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.hdoflix'
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId 'com.hdoflix'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName '2.4.0'
    }

    buildTypes {
        debug {
            // AGP supplies the standard debug keystore automatically.
        }
        release {
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.create('githubRelease') {
                    storeFile file(releaseKeystorePath)
                    storePassword releaseStorePassword
                    keyAlias releaseKeyAlias
                    keyPassword releaseKeyPassword
                }
            } else {
                // Local builds remain possible without secrets; GitHub uses a temporary release key.
                signingConfig signingConfigs.debug
            }
        }
    }
}

dependencies {
    implementation('com.facebook.react:react-android')
    if (hermesEnabled.toBoolean()) {
        implementation('com.facebook.react:hermes-android')
    } else {
        implementation jscFlavor
    }
}
