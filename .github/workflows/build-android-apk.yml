name: Build Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Verify project files
      run: |
        echo "Listing repo root:"
        ls -la
        test -f package.json || { echo "Missing package.json"; exit 1; }
        (test -f index.js || test -f index.tsx || test -f index.android.js) || { echo "Missing JS entry (index.js/index.tsx/index.android.js)"; exit 1; }
        (test -f App.tsx || test -f App.js || test -f src/App.tsx || test -f src/App.js) || { echo "Missing App component (App.tsx/App.js in root or src/)"; exit 1; }
        test -f android/settings.gradle || { echo "Missing android/settings.gradle"; exit 1; }
        test -f android/app/build.gradle || { echo "Missing android/app/build.gradle"; exit 1; }
        test -f android/app/src/main/AndroidManifest.xml || { echo "Missing AndroidManifest.xml"; exit 1; }

    - name: Make gradlew executable
      working-directory: android
      run: chmod +x ./gradlew

    - name: Build signed release APK
      working-directory: android
      env:
        KEYSTORE_PATH: ${{ runner.temp }}/signing/hdoflix-release.jks
        STORE_PASSWORD: github-build
        KEY_ALIAS: hdoflix
        KEY_PASSWORD: github-build
      run: ./gradlew --no-daemon --stacktrace --warning-mode all assembleRelease

    - name: List all APKs
      run: |
        find . -name "*.apk"
        ls -la android/app/build/outputs/apk/ || true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: |
          android/app/build/outputs/apk/release/*.apk
          android/**/*.apk
          **/*.apk

    - name: Upload build reports on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-reports
        path: |
          android/app/build/outputs/logs/**
          android/app/build/reports/**
          **/gradle-console.log
