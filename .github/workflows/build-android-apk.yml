name: Build HDOFlix Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
          validate-wrappers: false

      - name: Verify project files
        run: |
          test -f package.json
          test -f index.js
          test -f App.tsx
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund --prefer-online

      - name: React Native configuration check
        run: npx react-native config

      # - name: Typecheck
#   run: npm run typecheck

      - name: Create temporary release keystore
        env:
          STORE_PASSWORD: github-build
          KEY_PASSWORD: github-build
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/signing/hdoflix-release.jks" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias hdoflix \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=HDOFlix, OU=Build, O=HDOFlix, L=Unknown, ST=Unknown, C=US"

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/signing/hdoflix-release.jks
          STORE_PASSWORD: github-build
          KEY_ALIAS: hdoflix
          KEY_PASSWORD: github-build
        run: gradle --no-daemon --stacktrace --warning-mode all assembleRelease

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HDOFlix-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HDOFlix-build-reports
          path: |
            android/app/build/outputs/logs/**
            android/app/build/outputs/mapping/**
          if-no-files-found: ignore
          retention-days: 7
